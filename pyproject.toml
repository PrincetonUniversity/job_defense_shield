[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "job-defense-shield"
dynamic = ["version"]
description = "Identify and reduce instances of underutilization by the users of high-performance computing systems"
readme = "README.md"
authors = [{name="Jonathan Halverson", email="halverson@princeton.edu"}]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["alerts", "monitoring", "HPC", "Slurm", "underutilization", "Jobstats"]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22.4",
  "pandas>=2.1.0",
  "pyarrow>=15.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mock", "pytest-cov"]
database = ["mysqlclient", "sqlalchemy>=2.0"]
check = ["ruff>=0.6.0"]
docs = ["mkdocs-material"]

[project.urls]
"Documentation" = "https://princetonuniversity.github.io/job_defense_shield"
"Repository" = "https://github.com/PrincetonUniversity/job_defense_shield"

[project.scripts]
job_defense_shield = "job_defense_shield.job_defense_shield:main"

[tool.hatch.version]
path = "src/job_defense_shield/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.codespell]
ignore-words-list = "shs,nd"
